[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "typosquatting-checker"
version = "2.0.0"
description = "Generate typo variants of a domain and check which ones are live."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = ["requests>=2.28"]

[project.scripts]
typosquat = "typosquat.main:main"

[tool.setuptools]
packages = ["typosquat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
